#!/usr/sbin/nft -f

# AutoNetworkPolicy Default NFT Configuration
# This is a permissive base configuration that allows all traffic
# The AutoNetworkPolicy controller will dynamically update rules

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow loopback
        iif "lo" accept

        # Allow established connections
        ct state established,related accept

        # Allow ICMP
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # Allow SSH (optional - for debugging)
        tcp dport 22 accept

        # Log dropped packets
        log prefix "NFT DROP INPUT: " limit rate 5/second
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        # Allow established connections
        ct state established,related accept

        # Allow ICMP for debugging
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # Default: allow all forwarding (will be restricted by controller)
        accept

        # Log dropped packets
        log prefix "NFT DROP FORWARD: " limit rate 5/second
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

# NAT table for masquerading (if needed)
table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100;
    }
}
