[project]
name = "autonetworkpolicy"
version = "2.1.0"
description = "AI-guided firewall policy optimization using autoresearch loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dd>=0.5.7",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "seaborn>=0.12.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
autonp = "run:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["autonetworkpolicy*"]

[tool.pytest.ini_options]
testpaths = ["verify", "data", "evaluate", "."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-timeout>=2.4.0",
]
